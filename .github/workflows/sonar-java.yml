name: CI Code Quality - Java & SonarCloud

on:
  push:
    branches: [ "**" ]
    paths:
      - 'order-service/**'
      - 'auth-service/**'
      - 'customer-service/**'
  
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'order-service/**'
      - 'auth-service/**'
      - 'customer-service/**'

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [order-service, auth-service, customer-service]

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Fazer Cache dos pacotes do SonarCloud
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar-${{ matrix.service }}
        restore-keys: ${{ runner.os }}-sonar-

    - name: Analisar ${{ matrix.service }} com SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --file ${{ matrix.service }}/pom.xml