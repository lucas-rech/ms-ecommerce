name: CI Code Quality - Java & SonarCloud

on:
  push:
    branches: [ "**" ]
    paths:
      - 'order-service/**'
      - 'auth-service/**'
      - 'customer-service/**'
      - 'product-service/**'
      - 'inventory-service/**'
  
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'order-service/**'
      - 'auth-service/**'
      - 'customer-service/**'
      - 'product-service/**'
      - 'inventory-service/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services_to_build: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Identificar pastas alteradas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-service:
              - 'order-service/**'
            auth-service:
              - 'auth-service/**'
            customer-service:
              - 'customer-service/**'
            product-service:
              - 'product-service/**'
            inventory-service:
              - 'inventory-service/**'
  build-and-analyze:
    needs: detect-changes 
    if: ${{ needs.detect-changes.outputs.services_to_build != '[]' && needs.detect-changes.outputs.services_to_build != '' }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services_to_build) }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Fazer Cache dos pacotes do SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ matrix.service }}
          restore-keys: ${{ runner.os }}-sonar-
      
      - name: SonarCloud ${{ matrix.service }} analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          --file ${{ matrix.service }}/pom.xml 
          -Dsonar.organization=lucas-rech 
          -Dsonar.projectKey=lucas-rech_ms-ecommerce_${{ matrix.service }}